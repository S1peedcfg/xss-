  .vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.85) 100%);
    z-index: 1;
  }

  .scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    z-index: 2;
    pointer-events: none;
  }

  .center-name {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    text-align: center;
    user-select: none;
  }

  .center-name h1 {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: clamp(3.5rem, 7vw, 6rem);
    letter-spacing: 0.2em;
    color: #fff;
    text-transform: uppercase;
    line-height: 1;
    text-shadow:
      0 0 20px rgba(80,220,255,0.6),
      0 0 60px rgba(80,220,255,0.25),
      0 0 120px rgba(80,220,255,0.1);
    animation: flicker 6s infinite;
  }

  .center-name .line {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(80,220,255,0.5), transparent);
    margin: 0.45em auto 0;
  }
  .center-name .line.top { margin: 0 auto 0.45em; }

  @keyframes flicker {
    0%, 95%, 100% { opacity: 1; }
    96% { opacity: 0.82; }
    97% { opacity: 1; }
    98% { opacity: 0.9; }
    99% { opacity: 1; }
  }

  .profile-card {
    position: fixed;
    top: 50%;
    right: 2.8rem;
    transform: translateY(-50%);
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    background: rgba(10,14,20,0.75);
    border: 1px solid rgba(80,220,255,0.2);
    border-radius: 18px;
    padding: 1.8rem 1.6rem;
    backdrop-filter: blur(14px);
    box-shadow: 0 0 40px rgba(80,220,255,0.09), 0 8px 32px rgba(0,0,0,0.7);
    width: 220px;
  }

  .profile-card .avatar-wrap {
    position: relative;
    flex-shrink: 0;
  }

  .profile-card .avatar-wrap::before {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: conic-gradient(rgba(80,220,255,0.5), rgba(0,180,255,0.1), rgba(80,220,255,0.5));
    z-index: -1;
    animation: spin 4s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .profile-card .avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(10,14,20,0.9);
    display: block;
    position: relative;
  }

  .profile-card .status {
    position: absolute;
    bottom: 3px;
    right: 3px;
    width: 16px;
    height: 16px;
    background: #ed4245;
    border-radius: 50%;
    border: 3px solid rgba(10,14,20,0.9);
  }

  .profile-card .info {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.3rem;
    width: 100%;
  }

  .profile-card .username {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 1.25rem;
    color: #fff;
    letter-spacing: 0.06em;
    text-align: center;
  }

  .profile-card .handle {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    color: rgba(80,220,255,0.55);
    letter-spacing: 0.12em;
    text-align: center;
  }

  .divider {
    width: 80%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(80,220,255,0.3), transparent);
    margin: 0.2rem 0;
  }

  .profile-card .tags {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 0.2rem;
  }

  .profile-card .badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.62rem;
    color: rgba(255,255,255,0.45);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 5px;
    padding: 2px 7px;
    letter-spacing: 0.07em;
  }
